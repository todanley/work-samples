<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
body{margin:0;background:#F3EEE6;}
.ig{width:1080px;height:1080px;background:#F3EEE6;position:relative;overflow:hidden;}
.ig img{width:1080px;height:1080px;object-fit:cover;display:block;}
.ig .band{position:absolute;left:0;right:0;bottom:0;padding:48px 56px 56px;background:linear-gradient(to top, rgba(28,27,23,0.55) 0%, rgba(28,27,23,0.0) 100%);}
.ig .tw{color:#FBF8F2;font-size:64px;letter-spacing:0.05em;}
.ig .tw-line{width:180px;margin:12px 0 18px;}
.ig .tw-line path{stroke:#FBF8F2;}
.ig .line{font-family:'Fraunces Italic',Georgia,serif;font-style:italic;color:#FBF8F2;font-size:32px;line-height:1.3;max-width:820px;}
</style></head>
<body>
<div class="ig">
  <img src="img/tidewell-swatch.jpg" alt="">
  <div class="band">
    <div class="tw">Tidewell</div>
    <svg class="tw-line" viewBox="0 0 220 14"><path d="M2 9 C 28 9, 36 3, 62 3 S 96 11, 122 11 S 156 3, 182 3 S 210 9, 218 9" fill="none" stroke="#FBF8F2" stroke-width="1.4" stroke-linecap="round"/></svg>
    <div class="line">The 3pm tight-skin problem is often the room, not your face.</div>
  </div>
</div>
</body></html>
